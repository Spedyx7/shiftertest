name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ShiftTest.xcodeproj \
            -scheme ShiftTest \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ShiftTest.app Payload/
          zip -r ShiftTest.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShiftTest-ipa
          path: ShiftTest.ipa
          retention-days: 1
